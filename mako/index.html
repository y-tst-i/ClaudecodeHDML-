      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
      .frame { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); aspect-ratio: 16 / 9; width: min(100vw, calc(100dvh * 16 / 9)); }

      .frame canvas { width: 100%; height: 100%; display: block; }
